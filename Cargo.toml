[workspace]
members = [
    "osom-api",
    "osom-config",
    "osom-parser",
    "osom-llm",
    "osom-schema",
    "osom-writer",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["OsomAPI Team"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
